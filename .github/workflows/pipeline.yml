# Watch sweep CI — READ-ONLY by policy (security decision, 2026-08-26).
#
# This repo is PUBLIC. Therefore GitHub holds ZERO secrets/variables, and this
# workflow MUST stay free of anything that needs credentials, costs money, or
# writes data. Those stages (Fetch / LLM Extract / Sheet Queue) run only
# locally via scripts/run_pipeline.sh — see docs/local-automation.md.
name: data-watch

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC (09:00 MYT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Restore page-snapshot state
        uses: actions/cache@v4
        with:
          path: data/raw/page-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: |
            watch-state-

      - name: Run watch sweep (public sources only, no secrets used)
        run: python3 -m scripts.pipeline_watch --config data/sources.json --out "data/raw/watch-$(date +%F).json" --state data/raw/page-state.json

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-findings
          path: data/raw/watch-*.json
          retention-days: 90
